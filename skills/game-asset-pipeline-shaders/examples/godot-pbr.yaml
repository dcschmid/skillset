# example: 3D PBR project on Godot 4.7 renderer=Forward+ (copy to root)
engine: godot
engine_version: "4.7"             # probe project.godot config/features
art_style: realistic-pbr
targets: [desktop]
profile: high-end
texture_max_size: { albedo: 2048, normal: 2048 }
compression: { albedo: etc2-astc, masks: astc-6x6 }  # adapter-verified per renderer
mesh_budgets: { tris_per_asset: 50000, lods: [1.0, 0.5, 0.25] }
shader_requirements: { max_texture_samples: 12, variants_max: 48 }
quality_thresholds: { ssim_min: 0.95, pixel_diff_max_pct: 2.0 }
auto_fix:
  enabled: [repoint-missing-texture, dedupe-identical]
  protect: ["**/collision*", "*.uid"]
